[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoplm"
version = "1.0.0"
description = "Code accompanying the evoPLM paper"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "accelerate==1.10.1",
  "datasets==4.1.1",
  "fastparquet==2024.5.0",
  "matplotlib==3.10.6",
  "numpy==1.26.4",
  "pandas==1.5.3",
  "pyarrow==21.0.0",
  "safetensors==0.6.2",
  "scipy==1.15.2",
  "seaborn==0.13.2",
  "torch==2.5.1",
  "transformers==4.56.1",
]

[tool.setuptools.packages.find]
where = ["src"]
